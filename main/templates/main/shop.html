{% extends "main/base.html" %}
{% block content %}
    <div class="container-fluid page-header py-5 mb-5 wow fadeIn" data-wow-delay="0.1s">
        <div class="container py-5">
            <h1 class="display-1 text-white animated slideInDown">Shop</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb text-uppercase mb-0">
                    <li class="breadcrumb-item"><a class="text-white" href="/">Home</a></li>
                    <li class="breadcrumb-item text-primary active" aria-current="page">Shop</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-4 g-lg-5">
                {% for product in products %}
                <div class="col-6 col-md-4 col-lg-4 wow fadeInUp" data-wow-delay="0.1s">
                    <div class="shop-product-card">
                        <div class="product-image-wrap">
                            <img src="{{ product.image_url }}" alt="{{ product.name }}">
                            {% if product.badge %}<span class="product-badge">{{ product.badge }}</span>{% endif %}
                        </div>
                        <a href="#" class="product-name">{{ product.name }}</a>
                        <p class="product-price">R {{ product.price }}</p>
                        <div class="product-swatches">
                            {% for swatch in product.swatches.all %}
                            <button type="button" class="product-swatch {% if forloop.first %}active{% endif %}" style="background: {{ swatch.colour_hex }};" aria-label="{{ swatch.label }}"></button>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
